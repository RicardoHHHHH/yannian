name: Cross-platform checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.11'
          - os: macos-15
            python: '3.13'
          - os: macos-15-intel
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
    env:
      YANNIAN_PORT: '18765'
      YANNIAN_DATA_DIR: ${{ github.workspace }}/data
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
      - name: Frontend and PDF checks
        shell: bash
        run: |
          set -e
          node --check static/app.js
          node --check static/assistant.js
          node tests/test_frontend.cjs
          node tests/test_math.cjs
          node tests/test_pdf_geometry.mjs
          node tests/test_pdf_layout.mjs
          node tests/test_pdf_reader.mjs
          bash -n start.sh start.command
      - name: First launch and dependency setup
        run: python scripts/bootstrap.py --no-browser
      - name: Windows quick launch
        if: runner.os == 'Windows'
        shell: powershell
        run: .\start.ps1 -NoBrowser
      - name: macOS and Linux quick launch
        if: runner.os != 'Windows'
        run: bash start.sh --no-browser
      - name: Reused service health
        run: python -c "import json, urllib.request; opener=urllib.request.build_opener(urllib.request.ProxyHandler({})); r=json.load(opener.open('http://127.0.0.1:18765/api/health')); assert r['ok'] and r['app']=='yannian-workbench'; print(r)"
      - name: Source package
        run: python scripts/package_source.py
